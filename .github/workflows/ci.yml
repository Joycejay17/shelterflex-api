# shelterflex-api  ->  .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci --if-present

      - name: Validate OpenAPI spec
        run: npm run openapi:validate

  # Deliberately a separate job, and deliberately NOT in branch protection's
  # required checks yet.
  #
  # `tsc` currently reports 68 pre-existing errors (see #9), so this job is red
  # today. Folding it into the job above would make the required check fail and
  # block every open PR — including the ones fixing unrelated issues. As its own
  # non-required job it surfaces the problem on every PR without gating merges.
  #
  # Once #9 lands and this goes green, add "API (typecheck)" to the required
  # status checks on `main` so type errors can never silently accumulate again.
  # That accumulation was only possible because nothing checked: `npm run dev`
  # uses tsx, which strips types without checking them, and CI never ran tsc.
  typecheck:
    name: API (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
